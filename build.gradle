plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'wonpick.travel'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// log4j 2 사용
	implementation 'org.apache.logging.log4j:log4j-api:2.17.1'
	implementation 'org.apache.logging.log4j:log4j-core:2.17.1'

	//AWS SDK S3
	implementation 'software.amazon.awssdk:s3:2.20.88'

	//AWS cognito 의존성 추가
	implementation 'software.amazon.awssdk:cognitoidentityprovider:2.20.80'

	//Spring Cloud AWS 의존성 추가
	implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE'

	//AccessToken Decode 의존성 추가
	implementation 'com.auth0:java-jwt:4.3.0'

	//.env 파일 사용을 위한 의존성 추가
	implementation 'me.paulschwarz:spring-dotenv:3.0.0'

	// redisson 의존성 추가
	implementation 'org.redisson:redisson-spring-boot-starter:3.17.0'

}

tasks.named('test') {
	useJUnitPlatform()
}

jar {
	exclude 'docker/**'
	exclude 'Dockerfile'
	exclude '.dockerignore'
}
