spring:
  datasource:
    url: jdbc:mysql://localhost:3306/travelwonpick
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  servlet:
    session:
      timeout: 1h

logging:
  file:
    name: /app/logs/travelwonpick.log
  pattern:
    file: '%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n'