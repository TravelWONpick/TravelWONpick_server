spring:
  datasource:
    url: jdbc:mysql://localhost:3306/travelwonpick
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  profiles:
    include: s3, cognito, toss

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: 127.0.0.1
      port: 6379

server:
  servlet:
    session:
      timeout: 1h

logging:
  file:
    name: /app/logs/travelwonpick.log
  pattern:
    file: '%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n'

cloud:
  aws:
    credentials:
      access-key: AWS_ACCESS_KEY
      secret-key: AWS_SECRET_ACCESS_KEY
    region:
      static: ap-northeast-2
    stack:
      auto: false
