spring:
  datasource:
    url: "${DATASOURCE_URL}"
    username: "${DATASOURCE_USERNAME}"
    password: "${DATASOURCE_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  web:
    resources:
      static-locations: classpath:/empty/

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      url: redis://${REDIS_URL}

server:
  servlet:
    session:
      timeout: 1h

logging:
  file:
    name: ./logs/travelwonpick.log
  pattern:
    file: '%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n'

cloud:
  aws:
    credentials:
      access-key: "${AWS_ACCESS_KEY}"
      secret-key: "${AWS_SECRET_ACCESS_KEY}"
    s3:
      bucket-name: "${AWS_BUCKET_NAME}"
    region:
      static: "ap-northeast-2"
    cognito:
      client-id: "${AWS_CLIENT_ID}"
      user-pool-id: "${AWS_USER_POOL_ID}"
    stack:
      auto: false

toss:
  api:
    url: "${TOSS_API_URL}"
    widget-secret-key: "${TOSS_WIDGET_SECRET_KEY}"

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"